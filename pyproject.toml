[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "taskflow-api"
version = "2.0.0"
description = "A secure, multi-user task management REST API portfolio project."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Philip Okeke", email = "Engr.philipokeke@gmail.com" },
]
dependencies = [
  "alembic==1.19.1",
  "email-validator==2.3.0",
  "fastapi[standard]==0.141.1",
  "psycopg[binary]==3.3.4",
  "pwdlib[argon2]==0.3.1",
  "PyJWT==2.13.0",
  "sqlmodel==0.0.39",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.12.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
