databases:
  - name: taskflow-database
    plan: free
    databaseName: taskflow
    user: taskflow

services:
  - type: web
    name: taskflow-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-database
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_MINUTES
        value: "30"
